  sqlite3: ^3.5.2

dev_dependencies:
  build_runner: '>=2.15.1 <2.15.2'
  drift_dev: ^2.28.0
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  very_good_analysis: ^10.3.0
